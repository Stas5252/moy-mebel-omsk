<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <defs>
    <!-- Exact Champagne Gold Gradient from 2GIS reference -->
    <linearGradient id="exactGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="25%" stop-color="#fee082"/>
      <stop offset="55%" stop-color="#fccd71"/>
      <stop offset="85%" stop-color="#f0be52"/>
      <stop offset="100%" stop-color="#dcb668"/>
    </linearGradient>

    <!-- Warm Golden Ambient Glow Filter -->
    <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#fccd71" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#e0a830" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)" stroke="url(#exactGold)" stroke-width="16.5" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4" fill="none">
    <!-- Outer Shield Frame -->
    <path d="M 28,24 L 212,24 L 212,176 L 120,248 L 28,176 Z"/>

    <!-- Top Inverted Triangle -->
    <path d="M 28,24 L 120,96 L 212,24"/>

    <!-- Inner 'M' Chevrons -->
    <path d="M 28,88 L 74,124 L 120,88 L 166,124 L 212,88"/>

    <!-- Left Inner Vertical Leg -->
    <path d="M 74,124 L 74,212"/>

    <!-- Right Inner Vertical Leg -->
    <path d="M 166,124 L 166,212"/>

    <!-- Center Vertical Spine -->
    <path d="M 120,96 L 120,248"/>
  </g>
</svg>