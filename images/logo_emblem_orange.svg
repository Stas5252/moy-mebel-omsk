<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa33"/>
      <stop offset="45%" stop-color="#ff7a18"/>
      <stop offset="85%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#e04400"/>
    </linearGradient>
    <linearGradient id="orgGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="100%" stop-color="#ff8822"/>
    </linearGradient>
    <linearGradient id="orgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d44500"/>
      <stop offset="100%" stop-color="#992b00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Shield / Cube Outline -->
  <polygon points="120,12 216,68 216,180 120,236 24,180 24,68" 
           fill="none" stroke="url(#orgGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner Geometric Letter 'M' & Cube Ribs -->
  <!-- Left Column -->
  <polyline points="66,88 66,170" fill="none" stroke="url(#orgGradLight)" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Right Column -->
  <polyline points="174,88 174,170" fill="none" stroke="url(#orgGradDark)" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Center 'M' Peaks and Valleys -->
  <polyline points="66,88 120,140 174,88" fill="none" stroke="url(#orgGrad)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Center Vertical Spine -->
  <polyline points="120,140 120,205" fill="none" stroke="url(#orgGradLight)" stroke-width="15" stroke-linecap="round"/>
</svg>